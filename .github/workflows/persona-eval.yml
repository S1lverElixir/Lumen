name: Persona eval

# Ручной замер качества персоны по моделям (eval/persona_models.py).
# Триггер только workflow_dispatch: никаких автозапусков на пушах и никакого
# pull_request — иначе секреты из форков были бы доступны (аудит 22.10.2026).
# Раннеры GitHub — из США: с этой локации Google AI Studio отвечает отказом
# ("User location is not supported"), Groq — 403. С HF Space всё наоборот.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run (замер) или probe-tools (проверка поиска у Gemma)"
        required: false
        default: "run"
      model:
        description: "модель для probe-tools (без префикса провайдера)"
        required: false
        default: "gemma-4-31b-it"
      models:
        description: "Модели через запятую: provider:model (provider: gemini|gemma|groq|or)"
        required: false
        default: "gemma:gemma-4-31b-it,gemma:gemma-4-26b-a4b-it,gemini:gemini-3.5-flash-lite,or:nvidia/nemotron-3.5-lightning:free"
      judge:
        description: "Модель-судья (provider:model)"
        required: false
        default: "gemini:gemini-3.1-flash-lite"
      only:
        description: "Номера вопросов через запятую (пусто — все 25)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: persona-eval
  cancel-in-progress: false

jobs:
  eval:
    # Секреты провайдеров не должны достаться ветке с чужим eval-скриптом:
    # ручной запуск разрешён только с main (аудит 28.10.2026).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      # Только google-genai: замер не поднимает бота, нужен клиент Gemini.
      - run: pip install google-genai==2.27.0

      - name: Persona eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Входы workflow_dispatch идут в окружение, а не в текст скрипта:
          # подстановка ${{ inputs.* }} в run позволяла инъекцию команд рядом
          # с ключами провайдеров (аудит 26.10.2026).
          EVAL_MODE: ${{ inputs.mode }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_MODELS: ${{ inputs.models }}
          EVAL_JUDGE: ${{ inputs.judge }}
          EVAL_ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [ "$EVAL_MODE" = "probe-tools" ]; then
            python eval/persona_models.py probe-tools --model "$EVAL_MODEL"
            exit 0
          fi
          if [ -n "$EVAL_ONLY" ]; then
            python eval/persona_models.py run \
              --models "$EVAL_MODELS" \
              --judge "$EVAL_JUDGE" \
              --only "$EVAL_ONLY" \
              --out "$GITHUB_WORKSPACE/eval-out"
          else
            python eval/persona_models.py run \
              --models "$EVAL_MODELS" \
              --judge "$EVAL_JUDGE" \
              --out "$GITHUB_WORKSPACE/eval-out"
          fi

      - name: Report to job summary
        if: always()
        run: |
          if [ -f eval-out/report.md ]; then
            cat eval-out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "отчёт не собран" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: persona-eval-report
          path: eval-out
          if-no-files-found: warn
