name: Persona eval

# Ручной замер качества персоны по моделям (eval/persona_models.py).
# Триггер только workflow_dispatch: никаких автозапусков на пушах и никакого
# pull_request — иначе секреты из форков были бы доступны (аудит 22.10.2026).
# Раннеры GitHub — из США: с этой локации Google AI Studio отвечает отказом
# ("User location is not supported"), Groq — 403. С HF Space всё наоборот.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Модели через запятую: provider:model (provider: gemini|gemma|groq|or)"
        required: false
        default: "gemma:gemma-4-31b-it,gemma:gemma-4-26b-a4b-it,groq:qwen/qwen3.8-27b,gemini:gemini-3.5-flash-lite"
      judge:
        description: "Модель-судья (provider:model)"
        required: false
        default: "gemini:gemini-3.1-flash-lite"
      only:
        description: "Номера вопросов через запятую (пусто — все 25)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: persona-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # Только google-genai: замер не поднимает бота, нужен клиент Gemini.
      - run: pip install google-genai==2.27.0

      - name: Persona eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          ARGS="--models '${{ inputs.models }}' --judge '${{ inputs.judge }}' --out '$GITHUB_WORKSPACE/eval-out'"
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only '${{ inputs.only }}'"
          fi
          eval python eval/persona_models.py run $ARGS

      - name: Report to job summary
        if: always()
        run: |
          if [ -f eval-out/report.md ]; then
            cat eval-out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "отчёт не собран" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: persona-eval-report
          path: eval-out
          if-no-files-found: warn
