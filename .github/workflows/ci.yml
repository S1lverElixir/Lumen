name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # тот же самый гейт, что и раньше гонялся вручную (см. README) —
      # без glob, явным списком файлов, чтобы ловить кросс-файловые проблемы
      - run: pyflakes bot.py lumen_*.py system_prompt.py conftest.py test_*.py

      - run: pytest -q

      # проверка requirements.txt на известные CVE в зафиксированных версиях —
      # requirements-dev.txt (pytest/pyflakes/pip-audit) не сканируем: это
      # dev-инструменты, не попадающие в рантайм-образ (см. Dockerfile/.dockerignore)
      - run: pip-audit -r requirements.txt
