name: State backup

# Ежедневный автоматический бэкап /export_state (см. README, раздел
# "Диагностика") — раньше это был ручной curl владельца без расписания.
# Требует секреты в настройках репозитория:
#   SPACE_HOST         — хост HF Space (например, silverelixir-lumen.hf.space)
#   ADMIN_PANEL_KEY    — см. curl -H "Authorization: Bearer <BOT_TOKEN>" .../admin_keys
#   STATE_BACKUP_REPO  — приватный репозиторий для бэкапов, например S1lverElixir/Lumen-state
#   STATE_BACKUP_TOKEN — fine-grained PAT с Contents: read+write только на STATE_BACKUP_REPO
# Опционально (алерт о провале, аудит M11):
#   STATE_ALERT_TOKEN    — токен бота-сканера (lumen_smoke_bot), без прав админа
#   STATE_ALERT_CHAT     — личный chat_id владельца с этим ботом
# Без них провал виден только в сводке Actions.
#
# ПРИВАТНОСТЬ (инцидент, сентябрь 2026): раньше файл заливался артефактом
# Actions, а артефакты публичного репозитория может скачать любой. Теперь
# бэкап пушится git-коммитом в отдельный ПРИВАТНЫЙ репозиторий — каждый день
# отдельный коммит, история и есть глубина хранения. Ничего чувствительного
# в артефакты больше не кладётся.
on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC ежедневно
  workflow_dispatch:      # + ручной запуск по требованию

permissions:
  contents: read

# Два одновременных запуска (шедул + ручной) толкались бы в один бранч backup-репо.
concurrency:
  group: state-backup
  cancel-in-progress: false

jobs:
  backup:
    # Keep repository secrets away from workflow code on untrusted refs.
    # Scheduled runs use main and remain allowed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch /export_state
        env:
          # Секрет — через env, а не текстом run: шаг не публикует его в YAML (ревью 17.11.2026).
          ADMIN_PANEL_KEY: ${{ secrets.ADMIN_PANEL_KEY }}
          SPACE_HOST: ${{ secrets.SPACE_HOST }}
        run: |
          curl -sf --retry 3 --max-time 120 \
            -H "Authorization: Bearer ${ADMIN_PANEL_KEY}" \
            "https://${SPACE_HOST}/export_state" \
            -o export_state.json

      - name: Push to private backup repo
        env:
          STATE_BACKUP_TOKEN: ${{ secrets.STATE_BACKUP_TOKEN }}
          STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
        run: |
          set -euo pipefail
          # Validate the downloaded contract before touching the last good backup.
          # A non-zero chat count alone accepts partial and malformed snapshots.
          backup_filter='
            def finite_numbers:
              if type == "number" then isfinite
              elif type == "object" then all(.[]; finite_numbers)
              elif type == "array" then all(.[]; finite_numbers)
              else true end;
            def nonneg_int: type == "number" and isfinite and floor == . and . >= 0;
            def nonneg_num: type == "number" and isfinite and . >= 0;
            def valid_provider_entry:
              if type != "object" then false
              else
                ((has("used") | not) or (.used | nonneg_int)) and
                ((has("exhausted_at") | not) or
                 (.exhausted_at == null or (.exhausted_at | type == "number" and isfinite))) and
                ((has("cooldown_until") | not) or
                 (.cooldown_until == null or (.cooldown_until | type == "number" and isfinite))) and
                ((has("neurons") | not) or (.neurons | nonneg_num))
              end;
            def valid_daily_entry:
              if type != "object" then false
              else
                ((has("total") | not) or (.total | nonneg_int)) and
                ((has("gemini") | not) or (.gemini | nonneg_int)) and
                ((has("tts") | not) or (.tts | nonneg_int)) and
                ((has("draw") | not) or (.draw | nonneg_int)) and
                ((has("bonus") | not) or (.bonus | nonneg_int))
              end;
            (. | finite_numbers) and
            (.export_schema_version | type == "number" and floor == . and . == 1) and
            (.complete == true) and
            (.exported_at | type == "string" and length > 0) and
            (.chat_count | nonneg_int) and
            (.chat_count == (.chats | length)) and
            (.chats | type == "object" and length > 0) and
            (.global_quota | type == "object") and
            ([["gemini", "groq", "munito", "image"][] as $key |
              (if (.global_quota | has($key)) then .global_quota[$key] else {} end) |
              if type == "object" then all(.[]; valid_provider_entry) else false end
            ] | all) and
            ((if (.global_quota | has("user_daily")) then .global_quota.user_daily else {} end) |
              if type == "object" then (length <= 20000 and all(.[]; valid_daily_entry)) else false end) and
            ((if (.global_quota | has("stats")) then .global_quota.stats else {} end) |
              if type == "object" then all(.[]; nonneg_int) else false end) and
            ((if (.global_quota | has("banned_users")) then .global_quota.banned_users else {} end) |
              if type == "object" then all(.[]; nonneg_num) else false end) and
            (if (.global_quota | has("quota_day"))
             then (.global_quota.quota_day == null or (.global_quota.quota_day | type == "string"))
             else true end) and
            (if (.global_quota | has("last_storage_write_ts"))
             then (.global_quota.last_storage_write_ts | type == "number" and isfinite)
             else true end) and
            ([.chats | keys[] | test("^(0|-?[1-9][0-9]*)$")] | all) and
            ([.chats[] |
              (type == "object") and
              (.schema_version | type == "number" and floor == . and . == 2) and
              (.history | type == "array") and
              (.history | all(.[]; type == "object")) and
              (.memory_summary | type == "string") and
              (.memory_pending | type == "array") and
              (.memory_pending | all(.[]; type == "object")) and
              (.recent_media_ids | type == "object") and
              (.recent_media_ids | all(.[]; type == "array")) and
              (.user_names | type == "object") and
              (.user_names | all(.[]; type == "object")) and
              (.last_activity | type == "number" and isfinite) and
              (.lang | type == "string") and
              ((.last_drawn_message_id == null) or
               (.last_drawn_message_id | type == "number" and isfinite and floor == .)) and
              (.last_drawn_at | type == "number" and isfinite) and
              ((.last_drawn_user == null) or
               (.last_drawn_user | type == "number" and isfinite and floor == .)) and
              (.last_draw_prompt | type == "string") and
              ((has("replacement_generation") | not) or
               (.replacement_generation == null or
                (.replacement_generation | type == "string" and test("^[0-9a-f]{32}$")))) and
              (.draw_versions | type == "array") and
              (.draw_versions | all(.[]; type == "object" and (.file_id | type == "string"))) and
              (.draw_redo | type == "array") and
              (.draw_redo | all(.[]; type == "object" and (.file_id | type == "string")))
            ] | all)
          '
          jq -e -s "length == 1 and (.[0] | $backup_filter)" export_state.json >/dev/null
          # Приватность: бэкап только в приватный репозиторий, иначе стоп.
          visibility="$(GH_TOKEN="${STATE_BACKUP_TOKEN}" gh repo view "${STATE_BACKUP_REPO}" --json visibility -q .visibility)"
          if [ "${visibility}" != "PRIVATE" ]; then
            echo "Refusing backup: ${STATE_BACKUP_REPO} is not PRIVATE (got: ${visibility})" >&2
            exit 1
          fi
          git config --global user.name "lumen-backup"
          git config --global user.email "lumen-backup@local"
          # PAT не в URL клона, а в extraheader: иначе светится в remote -v и логах.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${STATE_BACKUP_TOKEN}" | base64 -w0)" \
            clone "https://github.com/${STATE_BACKUP_REPO}.git" backup-repo
          cp export_state.json backup-repo/export_state.json
          cd backup-repo
          git add export_state.json
          git diff --cached --quiet || git commit -m "Backup $(date -u +%Y-%m-%d)"
          # extraheader только на эту команду: в конфиге клона секрета нет.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${STATE_BACKUP_TOKEN}" | base64 -w0)" \
            push origin HEAD:main

      - name: Alert backup failure to Telegram
        # Бэкап — единственный резерв истории чатов, и раньше его провал жил только
        # в логах Actions (аудит M11, 10.2026). Состояние выводится из секретов:
        # без них шаг тихо пропускается и падение всё равно уходит в сводку ниже.
        #   STATE_ALERT_TOKEN — токен бота-сканера (lumen_smoke_bot), без прав админа
        #   STATE_ALERT_CHAT  — личный chat_id владельца с этим ботом
        # Токен не печатаем и не кладём в URL: он в extraheader-подобном Bearer.
        if: failure()
        env:
          STATE_ALERT_TOKEN: ${{ secrets.STATE_ALERT_TOKEN }}
          STATE_ALERT_CHAT: ${{ secrets.STATE_ALERT_CHAT }}
        run: |
          if [ -z "${STATE_ALERT_TOKEN}" ] || [ -z "${STATE_ALERT_CHAT}" ]; then
            echo "alert secrets not set — skipping Telegram alert" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -sf --retry 2 --max-time 20 -X POST \
            "https://api.telegram.org/bot${STATE_ALERT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$STATE_ALERT_CHAT" \
                   --arg t "Lumen: ежедневный бэкап состояния ПРОВАЛИЛСЯ. Проверь вкладку Actions." \
                   '{chat_id:$c, text:$t}')" \
            || echo "Telegram alert failed" >> "$GITHUB_STEP_SUMMARY"

      - name: Report backup failure
        if: failure()
        run: |
          echo "## State backup FAILED — проверьте вкладку Actions" >> "$GITHUB_STEP_SUMMARY"
          exit 1
