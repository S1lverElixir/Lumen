name: Deploy proxy

# Деплой Deno-прокси только после зелёного CI и только если менялся proxy/
# (аудит, 30.09.2026): раньше прокси выкатывался вручную из дашборда, код и
# деплой рассинхронизировались. Ждём воркфлоу "CI", как sync-to-hf.yml.
# Нужны секреты репозитория (только имена проектов; токен не нужен — deployctl
# ходит через GitHub OIDC, нужно право id-token: write ниже):
#   DENO_PROXY_PROJECT          — имя основного проекта прокси в Deno Deploy
#   DENO_PROXY_PROJECT_FALLBACK — имя резервного проекта прокси в Deno Deploy
# Плюс ручной шаг в дашборде Deno (один раз на проект): Settings → Git →
# подключить репозиторий, режим деплоя "GitHub Actions".
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Ручной запуск из вкладки Actions — например, чтобы выложить текущий код
  # после добавления секретов, без правок в proxy/.
  workflow_dispatch:

permissions:
  contents: read
  # deployctl ходит в Deno через GitHub OIDC, токен не нужен (см. denoland/deployctl).
  id-token: write
  # Ручной запуск проверяет, что CI для этого SHA зелёный (ревью 17.11.2026).
  actions: read

# Два CI подряд — деплоим по очереди, идущий деплой не отменяем.
concurrency:
  group: deno-proxy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Авто: только пуши в ЭТОТ репозиторий с зелёным CI (та же защита от форков, что в sync-to-hf.yml).
    # Вручную: только main — иначе ветка с изменённым proxy.ts получала бы
    # production OIDC и могла читать токен бота (аудит 28.10.2026).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a green CI run for the tip
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ручной запуск деплоил текущий main без доказательства зелёного CI
          # под id-token: write (ревью 17.11.2026).
          runs="$(gh run list --workflow CI --commit "${GITHUB_SHA}" --status success --limit 1 --json databaseId --jq 'length')"
          if [ "${runs}" -eq 0 ]; then
            echo "Refusing manual deploy: no successful CI run for ${GITHUB_SHA}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Тот коммит, что проверялся CI (см. sync-to-hf.yml); при ручном
          # запуске — текущий main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Report proxy changes on CI trigger
        id: proxy_changed_ci
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Дифф печатается для лога и истории, но деплой от него больше не зависит:
          # база HEAD~1 пропускала правку proxy/ в линейном мультикоммитном пуше,
          # и прогон выглядел зелёным со skipped-шагами (инцидент 09.11.2026,
          # аудит 16.11.2026). Деплой идемпотентен, поэтому выполняется всегда.
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            base="$(git merge-base HEAD^1 HEAD^2)"
          else
            base="HEAD~1"
          fi
          if git diff --name-only "$base" HEAD | grep -q '^proxy/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "proxy/ changed in this push; deploying."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::proxy/ unchanged in the last step of this push; still deploying because a linear multi-commit push can hide a proxy change."
          fi

      - name: Deploy to primary proxy
        # Deno Deploy закрывается в апреле 2027, а новые токены консоли не
        # проходят старый deployctl: API отвечает страницей входа (16.11.2026,
        # с новым токеном то же). Пока релей не мигрирован, шаги выключены и
        # job остаётся зелёным; включаются репозиторной переменной
        # DENO_PROXY_DEPLOY=1, когда появится рабочий путь выкатки.
        if: vars.DENO_PROXY_DEPLOY == '1'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        uses: denoland/deployctl@35381c73621e1731268f80e51b54718d086f1e64 # v1
        with:
          project: ${{ secrets.DENO_PROXY_PROJECT }}
          entrypoint: proxy/proxy.ts

      - name: Deploy to fallback proxy
        if: vars.DENO_PROXY_DEPLOY == '1'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        uses: denoland/deployctl@35381c73621e1731268f80e51b54718d086f1e64 # v1
        with:
          project: ${{ secrets.DENO_PROXY_PROJECT_FALLBACK }}
          entrypoint: proxy/proxy.ts
