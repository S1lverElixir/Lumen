name: Sync to HF Space

# ГЕЙТ НА CI (аудит техдолга, 26 августа 2026): раньше триггерился на push: [main]
# НЕЗАВИСИМО от ci.yml — оба воркфлоу стартовали параллельно на один и тот же пуш,
# и красный pytest/pyflakes/pip-audit никак не мешал задеплоить код на прод HF Space.
# Теперь ждём завершения воркфлоу "CI" и деплоим, только если он реально прошёл.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Два завершившихся подряд CI-прогона деплоились бы наперегонки: старый коммит
# перезаписывал новый. Сериализуем очередь, уже идущий деплой не отменяем.
concurrency:
  group: hf-space-sync
  cancel-in-progress: false

jobs:
  sync:
    # Только пуши в ЭТОТ репозиторий. Без второй проверки пул-реквест из форка с
    # веткой `main` (дефолтная ветка форка) проходил фильтр branches: [main] выше,
    # и его merge-коммит уезжал в прод Space с HF_TOKEN и всеми секретами Space
    # (аудит 26.09.2026).
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Явно берём тот коммит, что проверялся CI (workflow_run сам по себе
          # не чекаутит его) — иначе можно было бы задеплоить более поздний,
          # ещё не проверенный коммит с той же ветки.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          set -euo pipefail
          # Токен не в URL и не в .git/config: HF принимает его только как пароль
          # basic-auth на push (extraheader проходил fetch, но push просил логин,
          # прод 17.11.2026), поэтому отдаём через credential helper. Раннер эфемерный.
          HF_CRED='!f() { echo "username=user"; echo "password=${HF_TOKEN}"; }; f'
          git remote add hf "https://huggingface.co/spaces/${HF_SPACE_REPO}"
          # Сетевой/авторизационный сбой чтения прод-ветки нельзя глотать `|| true`:
          # тогда уходила ветка else и коммит пушился БЕЗ lease, молча затирая
          # хотфикс на Space — ровно тот случай, от которого проверка ниже (аудит 16.11.2026).
          if ! git -c credential.helper="$HF_CRED" fetch hf main; then
            set +e
            git -c credential.helper="$HF_CRED" ls-remote --exit-code --heads hf main >/dev/null 2>&1
            rc=$?
            set -e
            # rc=2 — ветки main на Space ещё нет (первый деплой), только тогда пуш без lease.
            if [ "$rc" -ne 2 ]; then
              echo "Cannot read HF Space main — refusing to push without lease." >&2
              exit 1
            fi
            echo "HF Space has no main branch yet — first deploy."
          fi
          # Хотфикс, залитый напрямую на Space, нельзя молча перезаписать:
          # сначала проверяем, что удалённая ветка — предок деплоимого коммита,
          # и только потом пушим с lease на конкретный SHA (аудит 28.10.2026).
          if git rev-parse --verify -q hf/main >/dev/null; then
            if ! git merge-base --is-ancestor hf/main HEAD; then
              echo "HF Space has commits not in this deploy branch (hotfix?) — refusing to overwrite." >&2
              exit 1
            fi
            git -c credential.helper="$HF_CRED" push hf HEAD:main --force-with-lease=main:"$(git rev-parse hf/main)"
          else
            git -c credential.helper="$HF_CRED" push hf HEAD:main
          fi
