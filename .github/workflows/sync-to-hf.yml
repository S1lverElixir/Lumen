name: Sync to HF Space

# ГЕЙТ НА CI (аудит техдолга, 26 августа 2026): раньше триггерился на push: [main]
# НЕЗАВИСИМО от ci.yml — оба воркфлоу стартовали параллельно на один и тот же пуш,
# и красный pytest/pyflakes/pip-audit никак не мешал задеплоить код на прод HF Space.
# Теперь ждём завершения воркфлоу "CI" и деплоим, только если он реально прошёл.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Два завершившихся подряд CI-прогона деплоились бы наперегонки: старый коммит
# перезаписывал новый. Сериализуем очередь, уже идущий деплой не отменяем.
concurrency:
  group: hf-space-sync
  cancel-in-progress: false

jobs:
  sync:
    # Только пуши в ЭТОТ репозиторий. Без второй проверки пул-реквест из форка с
    # веткой `main` (дефолтная ветка форка) проходил фильтр branches: [main] выше,
    # и его merge-коммит уезжал в прод Space с HF_TOKEN и всеми секретами Space
    # (аудит 26.09.2026).
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Явно берём тот коммит, что проверялся CI (workflow_run сам по себе
          # не чекаутит его) — иначе можно было бы задеплоить более поздний,
          # ещё не проверенный коммит с той же ветки.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          set -euo pipefail
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          # Lease вместо голого force: хотфикс, залитый напрямую на Space,
          # честно уронит push вместо молчаливого отката.
          git fetch hf main || true
          git push hf HEAD:main --force-with-lease
